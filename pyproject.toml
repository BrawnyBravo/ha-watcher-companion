[project]
name = "ha-watcher-companion"
version = "0.1.0"
description = "Home Assistant integration that shows status pushed by the ha-watcher service"
requires-python = ">=3.14"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/ha_watcher"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "PT"]
ignore = ["PLR2004", "PLR0913", "PLR0912", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true
force-sort-within-sections = true
